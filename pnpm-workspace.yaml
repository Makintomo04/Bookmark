packages:
  - apps/*
  - packages/*

# Install scripts pnpm may run; it blocks any others.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  prisma: true
  unrs-resolver: true
  # Downloads the sentry-cli binary that uploads source maps during web and EAS builds (BOO-54).
  '@sentry/cli': true
  '@vercel/speed-insights': false

# next-auth 4 declares an optional peer of nodemailer ^7; the app pins 10.0.16 for the high-severity
# advisories up to 10.0.5 and replaces next-auth's default sender with lib/mailer, so the newer major is fine.
peerDependencyRules:
  allowedVersions:
    next-auth>nodemailer: "10"

# The web app is on React 18 and the mobile app on React 19. Many libraries use React's types without
# declaring them, and find whichever copy is above them in node_modules: the root package.json installs
# React 18's at the top, matching the web app (otherwise the mobile app's React 19 types got hoisted and
# broke the web's type-check). The mobile app's libraries below do the same, so they're given
# @types/react as an optional peer, which pnpm fills with the mobile app's React 19 types.
packageExtensions:
  "expo-router":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "expo-modules-core":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "expo-apple-authentication":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "react-native-screens":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "react-native-svg":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "react-native-safe-area-context":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@react-native-google-signin/google-signin":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "standard-navigation":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "swr":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
